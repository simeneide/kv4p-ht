; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = kv4p_ht_esp32_wroom_32
default_envs = esp32dev, esp32dev-release, native-tests

; Route every I2S port call through i2sGuard.h, so a failed driver install
; refuses the key instead of crashing in i2s_set_pin() (TASK-1264.31).
[i2s_guard]
build_flags =
  -Wl,--wrap=i2s_driver_install -Wl,--wrap=i2s_driver_uninstall -Wl,--wrap=i2s_set_pin -Wl,--wrap=i2s_zero_dma_buffer -Wl,--wrap=i2s_write -Wl,--wrap=i2s_write_expand -Wl,--wrap=i2s_read -Wl,--wrap=i2s_set_sample_rates -Wl,--wrap=i2s_set_clk -Wl,--wrap=i2s_start -Wl,--wrap=i2s_stop -Wl,--wrap=i2s_adc_enable -Wl,--wrap=i2s_adc_disable

[env:esp32dev]
build_type = debug
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
extra_scripts = post:tools/set_app_version.py
test_build_src = no
test_ignore = *
build_flags =
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=0
  ${i2s_guard.build_flags}
lib_deps =
    ; fatpat/DRA818@^1.0.1
    https://github.com/fatpat/arduino-dra818.git#89582e3ef7bf3f31f1af149e32cec16c4b9e4cf2
    arduino-audio-tools=https://github.com/pschatzmann/arduino-audio-tools/archive/refs/tags/v1.2.3.zip
    https://github.com/pschatzmann/adpcm.git#v1.2.1
    dkaukov/esp32-afsk@0.1.4
    dkaukov/esp32-freedv2400b @ ^1.3.0

[env:esp32dev-release]
build_type = release
extends = env:esp32dev
build_unflags =
  -Os
build_flags =
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=0
  -DRELEASE=1
  -O3
  ${i2s_guard.build_flags}

; Bench-only build: identical to esp32dev-release except that the SA818 is
; never keyed, so TX audio paths, flow control and the TX summary log can be
; exercised silently with no antenna. Never ship or flash this to a radio in use.
[env:esp32dev-bench-no-rf]
extends = env:esp32dev-release
build_flags =
  ${env:esp32dev-release.build_flags}
  -DKV4P_BENCH_NO_RF=1

; Bench-only fault injection for the I2S guard: the first two key attempts of
; every press find no DMA heap for the TX driver. Never ship it.
[env:esp32dev-i2s-starve-test]
extends = env:esp32dev-release
build_flags =
  ${env:esp32dev-release.build_flags}
  -DKV4P_TEST_STARVE_I2S=2

; Bench-only: every key attempt fails, to check the per-press and per-job cap.
[env:esp32dev-i2s-starve-all-test]
extends = env:esp32dev-release
build_flags =
  ${env:esp32dev-release.build_flags}
  -DKV4P_TEST_STARVE_I2S=1000000

; Bench-only: the first seven key attempts of every press fail and the eighth,
; the last one the cap allows, installs. Checks a late success.
[env:esp32dev-i2s-starve-7-test]
extends = env:esp32dev-release
build_flags =
  ${env:esp32dev-release.build_flags}
  -DKV4P_TEST_STARVE_I2S=7

; Bench-only fault injection for the RX side: the first RX start after each
; transmission finds no DMA heap. Never ship it.
[env:esp32dev-i2s-starve-rx-test]
extends = env:esp32dev-release
build_flags =
  ${env:esp32dev-release.build_flags}
  -DKV4P_TEST_STARVE_I2S_RX=1

[env:native-tests]
build_type = test
platform = native
test_framework = unity
test_build_src = no
test_filter =
  test_kiss_protocol
  test_audio_codec
  test_freedv_squelch
  test_tx_audio_watchdog
  test_soft_squelch
  test_tx_jitter_buffer
  test_tx_key_retry
build_flags =
  -DPIO_NATIVE_TEST=1
  -std=gnu++17
  -Ikv4p_ht_esp32_wroom_32
  -Itest/native_stubs
  -I.pio/libdeps/esp32dev/esp32-afsk/src
  -I.pio/libdeps/esp32dev/esp32-freedv2400b/src
lib_deps =
  https://github.com/dkaukov/esp-dsp.git#native-test
